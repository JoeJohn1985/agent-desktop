name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # electron postinstall downloads a ~100MB binary that no unit test needs.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npx jest --no-coverage --ci

      # Informational only — the audit must not block the pipeline on a
      # transitive advisory nobody can act on right away.
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
