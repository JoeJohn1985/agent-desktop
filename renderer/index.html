<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Desktop</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../node_modules/xterm/css/xterm.css" />
  <link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" />
</head>
<body>

  <!-- Custom Title Bar -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar__left">
      <span class="titlebar__icon">🤖</span>
      <span class="titlebar__title">Copilot Desktop</span>
    </div>
    <div class="titlebar__center">
      <span class="titlebar__status" id="statusBadge">⚡ Bereit</span>
    </div>
    <div class="titlebar__controls">
      <button class="titlebar__btn" onclick="copilot.window.minimize()">─</button>
      <button class="titlebar__btn" onclick="copilot.window.maximize()">□</button>
      <button class="titlebar__btn titlebar__btn--close" onclick="copilot.window.close()">✕</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <!-- Sessions Section -->
      <div class="sidebar__section">
        <div class="sidebar__header" onclick="toggleSection('sessions')">
          <span class="sidebar__header-left"><span class="sidebar__chevron" id="sessionsChevron">▾</span> 📂 Sessions</span>
          <span class="sidebar__badge" id="sessionCount">0</span>
        </div>
        <div class="sidebar__search">
          <input type="text" id="sessionSearch" placeholder="Suchen…" />
        </div>
        <div class="sidebar__content" id="sessionsContent">
          <div class="sidebar__list" id="sessionList"></div>
        </div>
      </div>

      <!-- Skills Section -->
      <div class="sidebar__section">
        <div class="sidebar__header" onclick="toggleSection('skills')">
          <span class="sidebar__header-left"><span class="sidebar__chevron" id="skillsChevron">▾</span> 🛠️ Skills</span>
        </div>
        <div class="sidebar__content" id="skillsContent">
          <div class="sidebar__list" id="skillList"></div>
        </div>
      </div>

      <!-- Todos Section -->
      <div class="sidebar__section" id="todosSection" style="display:none;">
        <div class="sidebar__header" onclick="toggleSection('todos')">
          <span class="sidebar__header-left"><span class="sidebar__chevron" id="todosChevron">▾</span> ✅ Todos</span>
          <span class="sidebar__badge" id="todoCount">0</span>
        </div>
        <div class="sidebar__content" id="todosContent">
          <div class="todo-add">
            <input type="text" id="todoInput" placeholder="Neue Idee / Todo…" />
            <button class="todo-add__btn" id="btnAddTodo" title="Hinzufügen">+</button>
          </div>
          <div class="sidebar__list" id="todoList"></div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="sidebar__footer">
        <button class="action-btn action-btn--primary" id="btnNewSession" title="Neue Copilot-Session">
          ✨ Neue Session
        </button>
        <button class="action-btn" id="btnThemeToggle" data-tooltip="Theme wechseln">
          <span style="filter:grayscale(1) brightness(0.4)">🌙</span>
        </button>
        <button class="action-btn" id="btnSettings" data-tooltip="Einstellungen">
          ⚙️
        </button>
        <button class="action-btn" id="btnRefresh" title="Sessions neu laden">
          🔄
        </button>
      </div>
    </aside>

    <!-- Resize Handle -->
    <div class="resize-handle" id="resizeHandle"></div>

    <!-- Chat -->
    <main class="terminal-container">
      <div class="tab-bar" id="tabBar">
        <!-- Tabs werden dynamisch eingefügt -->
        <button class="tab-add" id="btnAddTab" title="Neuer Tab">+</button>
      </div>
      <div class="stream-area" id="streamArea">
        <!-- Search Bar -->
        <div class="chat-search" id="chatSearchBar">
          <input type="text" class="chat-search__input" id="chatSearchInput" placeholder="Suchen…" />
          <span class="chat-search__count" id="chatSearchCount"></span>
          <button class="chat-search__btn" id="chatSearchPrev" title="Vorheriger">▲</button>
          <button class="chat-search__btn" id="chatSearchNext" title="Nächster">▼</button>
          <button class="chat-search__btn" id="chatSearchClose" title="Schließen">✕</button>
        </div>
        <!-- Stream-Container pro Tab -->
        <button class="scroll-bottom-btn" id="btnScrollBottom" title="Ans Ende scrollen">↓ Neue Nachrichten</button>
        <div class="drop-overlay" id="dropOverlay">
          <div class="drop-overlay__content">📂 Dateien hier ablegen</div>
        </div>
      </div>
      <!-- Terminal Panel (for slash commands) -->
      <div class="terminal-panel" id="terminalPanel">
        <div class="terminal-panel__resize" id="terminalResize"></div>
        <div class="terminal-panel__header">
          <span class="terminal-panel__title">⚡ Terminal</span>
          <div class="terminal-panel__actions">
            <button class="terminal-panel__btn" id="btnTerminalMinimize" title="Terminal einklappen">▾</button>
            <button class="terminal-panel__btn" id="btnTerminalClose" title="Terminal beenden">✕</button>
          </div>
        </div>
        <div class="terminal-panel__body" id="terminalBody"></div>
      </div>
      <div class="session-statusbar" id="sessionStatusbar">
        <span class="session-statusbar__item" id="sbModel" title="Modell">🧠 –</span>
        <span class="session-statusbar__sep">·</span>
        <span class="session-statusbar__item" id="sbMcp" title="MCP Server">🔌 –</span>
        <span class="session-statusbar__sep">·</span>
        <span class="session-statusbar__item" id="sbSkills" title="Skills">🛠️ –</span>
        <span class="session-statusbar__sep">·</span>
        <span class="session-statusbar__item" id="sbInstructions" title="Instructions">📜 –</span>
        <span class="session-statusbar__sep">·</span>
        <span class="session-statusbar__item" id="sbCwd" title="Arbeitsverzeichnis">📁 –</span>
      </div>
      <div class="chat-input-bar">
        <button class="chat-terminal-btn" id="btnOpenTerminal" title="Terminal öffnen">⚡</button>
        <button class="chat-terminal-btn" id="btnExportChat" title="Chat exportieren">📥</button>
        <textarea class="chat-input" id="chatInput" placeholder="Nachricht eingeben…" rows="1"></textarea>
        <button class="chat-send" id="btnSend" title="Senden">➤</button>
      </div>
    </main>
  </div>

  <!-- Confirm Delete Overlay -->
  <div class="overlay" id="deleteOverlay">
    <div class="overlay__dialog">
      <div class="overlay__title">Session löschen</div>
      <div class="overlay__message" id="deleteMessage">Möchtest du diese Session wirklich unwiderruflich löschen?</div>
      <div class="overlay__actions">
        <button class="action-btn" id="btnDeleteCancel">Abbrechen</button>
        <button class="action-btn action-btn--danger" id="btnDeleteConfirm">Endgültig löschen</button>
      </div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div class="overlay" id="settingsOverlay">
    <div class="overlay__dialog overlay__dialog--settings">
      <div class="overlay__title">⚙️ Einstellungen</div>
      <div class="settings">
        <div class="settings__group">
          <label class="settings__label">Theme</label>
          <select class="settings__select" id="settTheme">
            <option value="light">☀️ Hell</option>
            <option value="dark">🌙 Dunkel</option>
            <option value="gebit">🏢 GEBIT</option>
          </select>
        </div>
        <div class="settings__group">
          <label class="settings__label">Schriftgröße Chat</label>
          <div class="settings__range-row">
            <input type="range" class="settings__range" id="settFontSize" min="12" max="22" step="1" />
            <span class="settings__range-value" id="settFontSizeVal">16px</span>
          </div>
        </div>
        <div class="settings__group">
          <label class="settings__label">Benachrichtigungston</label>
          <label class="settings__toggle">
            <input type="checkbox" id="settSound" checked />
            <span class="settings__toggle-slider"></span>
          </label>
        </div>
      </div>
      <div class="overlay__actions">
        <button class="action-btn action-btn--primary" id="btnSettingsClose">Schließen</button>
      </div>
    </div>
  </div>

  <script src="../node_modules/xterm/lib/xterm.js"></script>
  <script src="../node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
